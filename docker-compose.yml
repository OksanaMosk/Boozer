version: '3.8'

services:
  app:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=configs.settings
    ports:
      - "8000:8000"
    restart: on-failure
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: on-failure

  celery:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    restart: on-failure
    depends_on:
      - app
      - redis
    command: >
      sh -c 'celery -A configs worker -l info'

  celery-beat:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    restart: on-failure
    depends_on:
      - app
      - redis
    command: sh -c 'celery -A configs beat -l info'

  next-client:
    build:
      context: ./next-client
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_KEY=${NEXT_PUBLIC_SUPABASE_KEY}
        - NEXT_PUBLIC_SUPABASE_BUCKET_NAME=${NEXT_PUBLIC_SUPABASE_BUCKET_NAME}
        - AUTH_TRUST_HOST=true
    container_name: next-client
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    command: npm run start
    depends_on:
      - app

  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/static:/drf-static
      - ./backend/storage:/app/storage
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - next-client
