{% extends 'base.html' %}
{% block body %}

<div style="max-width: 600px; margin: 0 auto; background:linear-gradient(
  90deg,
  #000 0%,
  #000 30%,
  #1f2937 50%,
  #000 70%,
  #000 100%
); border: 2px solid #7a5c1e; border-radius: 24px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6);">
    <div style="background: linear-gradient(90deg, #7a5c1e, #f5e6a1, #f5e6a1, #f5e6a1, #7a5c1e); padding: 45px 20px; text-align: center;">
        <h1 style="font-family: 'Playfair Display', serif; color: #21190c; margin: 0; font-size: 34px; text-transform: uppercase; font-weight: 900; letter-spacing: 4px;">
           Welcome to VIP Boozer!
        </h1>
        <p style="font-family: 'Imperial Script', cursive; color: #4d3a1c; font-size: 30px; margin: 5px 0 0 0;">
           To reset your password, please click the button below:
        </p>
    </div>

    <div style="padding: 40px 30px; text-align: center; ">


        <div style="margin: 30px 0; padding: 35px; border: 1px solid #7a5c1e; border-radius: 18px; background:linear-gradient(
    90deg,
    #7a5c1e,
    #f5e6a1,
    #f5e6a1,
    #f5e6a1,
    #7a5c1e
  );;">
            <div style="background: linear-gradient(90deg, #7a5c1e, #f5e6a1, #7a5c1e); margin-bottom: 25px;"></div>
            <p style="margin: 10px 0 0 0; color: #000000; font-size: 48px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                 <a href="{{ url }}" style="text-decoration: none; color: #7a5c1e; font-weight: bold; display: inline-block;">
      Reset Password
                </a>
            </p>
        </div>

        <p style="color: #7a5c1e; font-size: 12px; margin-top: 50px; border-top: 1px solid #4d3a1c; padding-top: 25px; text-transform: uppercase; letter-spacing: 1px;">
            If you did not request a password reset, you can safely ignore this email.
        </p>
    </div>
</div>


{% endblock %}
